[project]
name = "renpy"
readme = "README.rst"
license = "MIT"
version= "8.99.99"
requires-python = ">=3.12.8,<3.13"
dependencies = [
    "future",
    "six",
    "pefile",
    "requests",
    "rsa",
    "setuptools",
    "cython",
    "ruff",
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx_rtd_dark_mode",
    "sphinx-tabs",
    "jinja2",
    "pkgconfig>=1.6.0",
    "chardet>=7.4.3",
    "websockets>=16.0",
    "pysocks>=1.7.1",
]


# For now those are listed in project requirements until build system is updated.
# [project.optional-dependencies]
# dev = ["setuptools", "cython", "ruff"]

# For now, Ren'Py isn't using a build system, as build isolation makes building too slow.

# [build-system]
# requires = ["setuptools", "cython"]
# build-backend = "setuptools.build_meta:__legacy__"

[tool.pyright]
include = [
    "*.py",
    "renpy/",
    "src/"
]

exclude = [
    "module/build/",
]

ignore = [
    "renpycoverage.py"
]

typeCheckingMode = "basic"

reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportOptionalOperand = false
reportMissingModuleSource = false
reportUnnecessaryTypeIgnoreComment = "information"
reportTypeCommentUsage = "information"

[tool.cyright]
include = [
    "*.py",
    "renpy/",
    "src/"
]

exclude = [
    "module/build/",
]

ignore = [
    "renpycoverage.py"
]

reportGeneralTypeIssues = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportOptionalOperand = false
reportMissingModuleSource = false



[tool.ruff]
line-length = 120
extend-exclude = [
    "keywords.py",
    "renpy/text/emoji_trie.py",
]

[tool.ruff.lint.per-file-ignores]
# Host shims intentionally swallow broad exceptions and use fallback patterns
# to keep Ren'Py parity (do not crash on fallback). Bulk noqa was 4994->0 narrow;
# now explicit per-file-ignores.
"host/python/**/*.py" = ["BLE001", "S110", "S112", "TRY002", "TRY004", "B018", "F821", "F811", "RUF034", "SIM102", "I001"]
"host/python/gates/**/*.py" = ["BLE001", "S110", "S112", "TRY002", "TRY004", "B018", "F821", "F811", "RUF034", "SIM102", "UP031", "SIM115", "RUF059", "B023", "PERF402", "RUF012", "S102", "EXE001", "F823", "I001", "F401"]
"renpy/wgpu/**/*.py" = ["BLE001", "S110", "S112", "TRY002", "TRY004", "B018", "F821", "F811", "RUF034", "SIM102", "I001", "E722", "SIM103", "F841", "RUF046", "C408", "TC004", "RUF059", "RUF022", "RUF023", "F401", "RUF100"]
[tool.ruff.format]
